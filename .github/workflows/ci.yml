name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [ "11", "14", "17", "20" ]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with -std=c++${{ matrix.std }}
        run: make test CXXFLAGS="-std=c++${{ matrix.std }} -Wall -Wextra -pedantic -O2"
